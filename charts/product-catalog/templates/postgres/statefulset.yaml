{{- $labels := dict "root" $ "name" "postgres" "component" "database" }}
{{- with .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-api-postgres
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "product-catalog.labels" $labels | nindent 4 }}
spec:
  replicas: 1
  serviceName: catalog-api-postgres
  selector:
    matchLabels:
      {{- include "product-catalog.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "product-catalog.labels" $labels | nindent 8 }}
    spec:
      containers:
      - name: postgres
        image: {{ .image }}
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
          name: postgres
        # shared_buffers (128MB by default) plus about 10MB per connection, plus headroom.
        resources:
          {{- toYaml .resources | nindent 10 }}
        # pg_isready over TCP, like the clients. During first-time init Postgres listens
        # on its Unix socket only, so the pod stays not-ready until init has finished.
        # sh -c expands the env vars; a probe's exec command has no $(VAR) substitution.
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      # The PVC is named <template>-<pod>: data-catalog-api-postgres-0.
      name: data
      labels:
        # Stable labels only: volumeClaimTemplates can't change after creation.
        {{- include "product-catalog.stableLabels" $labels | nindent 8 }}
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with .storage.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .storage.size }}
{{- end }}
