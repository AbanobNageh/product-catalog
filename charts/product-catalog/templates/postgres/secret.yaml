{{- if .Values.postgres.enabled }}
{{- $labels := dict "root" $ "name" "postgres" "component" "database" }}
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product-catalog.labels" $labels | nindent 4 }}
# `data` holds base64 (encoded, not encrypted); b64enc does the encoding at render time.
data:
  POSTGRES_USER: {{ .Values.postgres.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required (values-dev.yaml sets a local one)" .Values.postgres.auth.password | b64enc | quote }}
{{- end }}
