{{- $labels := dict "root" $ "name" "postgres" "component" "database" }}
apiVersion: v1
kind: Service
metadata:
  name: catalog-api-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product-catalog.labels" $labels | nindent 4 }}
spec:
  # Headless: DNS answers with the pod's own IP, and catalog-api-postgres-0 gets a stable name.
  clusterIP: None
  selector:
    {{- include "product-catalog.selectorLabels" $labels | nindent 4 }}
  ports:
  - protocol: TCP
    name: postgres
    port: 5432
    targetPort: postgres
