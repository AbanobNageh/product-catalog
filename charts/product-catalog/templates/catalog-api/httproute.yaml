{{- if .Values.catalogApi.route.enabled }}
{{- $labels := dict "root" $ "name" "catalog-api" "component" "api" "version" .Values.catalogApi.image.tag }}
{{- with .Values.catalogApi.route }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-api
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "product-catalog.labels" $labels | nindent 4 }}
spec:
  # The app team's side: attach to the operator's Gateway, on one of its listeners.
  parentRefs:
  - name: {{ .gateway.name }}
    namespace: {{ .gateway.namespace }}
    sectionName: {{ .gateway.sectionName }}
  hostnames:
  # `required` stops the install with this message when the value is empty.
  - {{ required "catalogApi.route.hostname is required when the route is enabled (for example catalog.localhost)" .hostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: catalog-api
      port: 3000
{{- end }}
{{- end }}
