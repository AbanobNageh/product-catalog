{{- /*
Renders nothing: it stops an install with a clear message when an in-chart dependency is
switched off without saying where the external one is (ADR-0018). Without these checks
the pods would start and fail to connect, which is slower to diagnose.
*/ -}}
{{- if not .Values.catalogApi.apiKeysSecret }}
{{- fail "catalogApi.apiKeysSecret is required: a Secret with READ_API_KEY, WRITE_API_KEY and ADMIN_API_KEY (ADR-0020)" }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.catalogApi.database.existingSecret) }}
{{- fail "postgres.enabled is false: set catalogApi.database.existingSecret (a Secret with a DATABASE_URL key)" }}
{{- end }}
{{- if and (not .Values.redis.enabled) (not .Values.catalogApi.redisUrl) }}
{{- fail "redis.enabled is false: set catalogApi.redisUrl" }}
{{- end }}
{{- if and (not .Values.opensearch.enabled) (not .Values.searchService.opensearchUrl) }}
{{- fail "opensearch.enabled is false: set searchService.opensearchUrl" }}
{{- end }}
