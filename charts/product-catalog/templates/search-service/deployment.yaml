{{- $labels := dict "root" $ "name" "search-service" "component" "api" "version" .Values.searchService.image.tag }}
{{- with .Values.searchService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "product-catalog.labels" $labels | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      {{- include "product-catalog.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "product-catalog.labels" $labels | nindent 8 }}
    spec:
      containers:
      - name: search-service
        image: "{{ .image.repository }}:{{ .image.tag }}"
        imagePullPolicy: {{ .image.pullPolicy }}
        env:
        # `default` uses the in-chart OpenSearch Service unless an external URL is given.
        - name: OPENSEARCH_URL
          value: {{ .opensearchUrl | default (printf "http://%s:9200" $.Values.opensearch.masterService) | quote }}
        - name: LOG_LEVEL
          value: {{ .logLevel | quote }}
        ports:
        - containerPort: 8080
          name: http
        resources:
          {{- toYaml .resources | nindent 10 }}
        # The server listens only once OpenSearch is reachable (it waits up to 30s, then exits).
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        lifecycle:
          preStop:
            sleep:
              seconds: 5
{{- end }}
