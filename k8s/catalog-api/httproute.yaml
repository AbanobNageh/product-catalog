apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-api
  namespace: catalog
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/instance: catalog-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: product-catalog
spec:
  # The app team's side: attach to the operator's Gateway, on its `web` listener.
  parentRefs:
  - name: product-catalog
    namespace: traefik
    sectionName: web
  hostnames:
  - catalog.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: catalog-api
      port: 3000
