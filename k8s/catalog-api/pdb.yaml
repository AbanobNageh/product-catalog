apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: catalog
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/instance: catalog-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: product-catalog
spec:
  # Voluntary disruptions (kubectl drain, node upgrades) may evict a pod only while
  # at least one other ready pod stays up. Crashes and OOMKills aren't covered.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
      app.kubernetes.io/instance: catalog-api
