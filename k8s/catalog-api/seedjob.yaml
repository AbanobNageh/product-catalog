apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-api-seed
  namespace: catalog
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/instance: catalog-api-seed
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: product-catalog
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/instance: catalog-api-seed
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: product-catalog
    spec:
      containers:
      - name: catalog-api-seed
        # The runtime image ships the seed (ADR-0006); only the command differs.
        image: catalog-api:0.1.1
        command: ["node", "dist/seed/main.js"]
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-api-postgres
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@catalog-api-postgres:5432/$(POSTGRES_DB)"
        # Reindex goes through the catalog-api Service, like any other client.
        - name: CATALOG_API_URL
          value: "http://catalog-api:3000"
      restartPolicy: Never
  backoffLimit: 2
