apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
  namespace: catalog
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/instance: catalog-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: product-catalog
spec:
  # The HPA owns the Deployment's replica count from now on (deployment.yaml has no `replicas`).
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-api
  # 2 keeps one pod serving while the other restarts or rolls out (see pdb.yaml).
  minReplicas: 2
  maxReplicas: 5
  metrics:
  # Average CPU across the pods, as a percentage of their CPU request (200m).
  # 70% = 140m per pod: above it the HPA adds pods, well below it removes them.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Defaults kept: scale up at once (up to double, or +4 pods, every 15s);
  # scale down only after 5 minutes of lower load, so a short dip doesn't remove pods.
