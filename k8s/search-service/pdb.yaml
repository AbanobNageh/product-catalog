apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-service
  namespace: catalog
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/instance: search-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: product-catalog
spec:
  # Same as catalog-api: a drain keeps at least one of the two pods serving.
  # OpenSearch, Postgres and Redis have one pod each, so a PDB there would only block drains.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
      app.kubernetes.io/instance: search-service
