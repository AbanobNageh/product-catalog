apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: catalog
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/instance: search-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: product-catalog
spec:
  selector:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/instance: search-service
  ports:
  - protocol: TCP
    name: http
    port: 8080
    targetPort: http
