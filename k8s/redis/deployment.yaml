apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api-redis
  namespace: catalog
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: catalog-api-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: product-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: catalog-api-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: catalog-api-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: product-catalog
    spec:
      containers:
      - name: redis
        image: redis:8-alpine
        # A full cache evicts the least-recently-used keys, staying below the memory limit
        # instead of growing until the kernel kills it (OOMKilled).
        args: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 128Mi
        # Not ready = taken out of the Service's endpoints. `redis-cli ping` answers PONG
        # once Redis accepts commands (Compose uses the same check).
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
          timeoutSeconds: 3