apiVersion: v1
kind: Service
metadata:
  name: catalog-api-redis
  namespace: catalog
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: catalog-api-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: product-catalog
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: catalog-api-redis
  ports:
  - protocol: TCP
    name: redis
    port: 6379
    targetPort: 6379