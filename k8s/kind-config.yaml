kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: catalog
nodes:
- role: control-plane
- role: worker
  # This port will be used with Traefik and so Traefik must match this port and the `gateway-node` label.
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    listenAddress: "127.0.0.1"
  - containerPort: 443
    hostPort: 443
    listenAddress: "127.0.0.1"
  labels:
    catalog/role: gateway-node
- role: worker