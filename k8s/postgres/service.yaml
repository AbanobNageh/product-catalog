apiVersion: v1
kind: Service
metadata:
  name: catalog-api-postgres
  namespace: catalog
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: catalog-api-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: product-catalog
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: catalog-api-postgres
  ports:
  - protocol: TCP
    name: postgres
    port: 5432
    targetPort: 5432