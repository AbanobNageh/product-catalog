apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search-service-opensearch
  namespace: catalog
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: search-service-opensearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: product-catalog
spec:
  replicas: 1
  serviceName: "search-service-opensearch"
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: search-service-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/instance: search-service-opensearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: product-catalog
    spec:
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:3.9.0
        env:
        - name: discovery.type
          value: "single-node"
        # Local only. With the security plugin off, no admin password is needed.
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        # Blocks auto-creating products* indices; search-service refuses to start otherwise (ADR-0007).
        - name: action.auto_create_index
          value: "-products*,+*"
        # No bootstrap.memory_lock: it needs a memlock ulimit, which a pod spec can't set,
        # and pods don't swap by default anyway.
        ports:
        - containerPort: 9200
          name: http
        # Heap is 512 MB; the rest is off-heap JVM memory and Lucene. Memory request = limit.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 1Gi
        # Up to 3 minutes to boot before liveness and readiness start.
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 36
        # Liveness: the HTTP layer answers. A red cluster stays alive; a restart wouldn't fix it.
        livenessProbe:
          httpGet:
            path: /
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        # Readiness: the cluster is at least yellow. The health API answers 408 if not, within 1s.
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=1s
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: search-service-opensearch-volume
          mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
  - metadata:
      name: search-service-opensearch-volume
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/instance: search-service-opensearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: product-catalog
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
