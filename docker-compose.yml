# Local run for Part 1. 1.2 added Postgres and Redis, 1.3 adds OpenSearch;
# 1.4 adds the two services.
name: product-catalog

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog # local only
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data in /var/lib/postgresql/<major>/docker,
      # so mount the parent. The old /var/lib/postgresql/data mount is wrong now.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    # Pinned: the `latest` tag points at the 2.19 line, not 3.x (ADR-0005).
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Local only. With the security plugin off, no admin password is needed.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
  opensearch-data:
