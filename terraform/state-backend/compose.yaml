# Remote state backend for the Terraform environments (T4, ADR-0016).
#
# MinIO is an S3-compatible object store: it speaks the same HTTP API as
# Amazon S3, so Terraform's `s3` backend can store state in it. Each
# environment (terraform/envs/<env>) keeps its state as one object, and
# its lock as a second object next to it while a run is in progress.
#
# Its own Compose project (`catalog-state`), separate from the app's
# docker-compose.yml, so `docker compose down -v` there can't delete the
# state of every environment. Run from this folder:
#   Copy-Item .env.example .env   (then set the two secrets)
#   docker compose up -d
#   docker compose ps -a          (minio running, setup Exited (0))
#
# MinIO's own images stopped being published in 2025 and the project is
# archived. Chainguard rebuilds it from source; its free tier only offers
# `latest`, so both images are pinned by digest (the image's content hash).
# To update: `docker buildx imagetools inspect cgr.dev/chainguard/minio:latest`
# and copy the new digest.

name: catalog-state

services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:87896cb33f93ecfcca4e883c3fb2f86a0a1a600c003a104011ed30631c1869c3
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      # The root user is MinIO's admin account. Only `setup` below uses it;
      # Terraform gets a smaller user.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API (Terraform's endpoint)
      - "127.0.0.1:9001:9001" # web console: http://localhost:9001
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot job: creates the bucket and Terraform's user, then exits.
  # Safe to re-run (`docker compose up -d` runs it again each time).
  # `mc` is the MinIO client; the `-dev` image variant includes a shell.
  setup:
    image: cgr.dev/chainguard/minio-client@sha256:dd66c90b44905bcef51efdbdffd2762cbfcd0f10d64449f3f57f0429f5f49ee2
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env}
      TF_STATE_ACCESS_KEY: ${TF_STATE_ACCESS_KEY:?set it in .env}
      TF_STATE_SECRET_KEY: ${TF_STATE_SECRET_KEY:?set it in .env}
    volumes:
      - ./terraform-state-policy.json:/policy.json:ro
    # `$$` passes a literal `$` to the shell; a single `$` would be filled in
    # by Compose itself.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Wait for MinIO to accept the root credentials. `local` is an alias:
        # mc's saved name for this server's URL and credentials.
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done

        # The bucket holds every environment's state, one key (object path) each.
        mc mb --ignore-existing local/terraform-state
        # Versioning keeps every previous state, so a bad write can be undone.
        mc version enable local/terraform-state
        # A lifecycle rule deletes old versions after 90 days, and the delete
        # markers (what versioning leaves when an object is deleted, such as
        # each released lock) once nothing is left behind them. The latest
        # state never expires. Added only if the bucket has no rule yet.
        mc ilm rule ls local/terraform-state >/dev/null 2>&1 ||
          mc ilm rule add --noncurrent-expire-days 90 --expire-delete-marker local/terraform-state

        # A policy is a JSON list of allowed actions on resources (the same
        # format as AWS IAM). Terraform's user gets this one only.
        mc admin policy create local terraform-state /policy.json
        mc admin user add local "$$TF_STATE_ACCESS_KEY" "$$TF_STATE_SECRET_KEY"
        mc admin policy attach local terraform-state --user "$$TF_STATE_ACCESS_KEY" 2>/dev/null || true
        echo "terraform-state bucket and user $$TF_STATE_ACCESS_KEY ready"

volumes:
  minio-data:
